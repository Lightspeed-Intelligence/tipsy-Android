# 版本目录：全部显式固定，禁止 `+` 或动态版本（方案 §3.3）。
#
# 「RN 兼容基线」一栏不是选型，而是 tipsy-app 固定 pin 下 RN 0.81.4 的兼容事实，
# 真值来自 tipsy-app/node_modules/react-native/gradle/libs.versions.toml。
# 改这些值前必须先核对 RN 侧该文件，并跑通三个 flavor 的 assemble。
[versions]
# ── RN 0.81.4 兼容基线（勿擅自升级）──
agp = "8.11.0"
kotlin = "2.1.20"
compileSdk = "36"
targetSdk = "36"
minSdk = "24"
buildTools = "36.0.0"
ndk = "27.1.12297006"
# CMake 版本钉死：RN 新架构下 :app 与多个模块要跑 CMake，CI 需显式安装同一版本
# （AGP 默认会挑「已装的最高版」，本机与 CI 不一致会产生难复现的构建差异）。
cmake = "3.22.1"
# 必须与 react-native-mmkv 4.1.0 依赖的原生 MMKV **完全一致**，否则壳读不了 RN 写的文件。
# 注意它用的不是腾讯官方 com.tencent:mmkv，而是 fork io.github.zhongwuzw:mmkv
# （已核实 node_modules/react-native-mmkv/android/build.gradle:142）。
# 升 RN 侧 MMKV 时**必须同步这里**，版本漂移的症状是「读不到 token / 静默当作未登录」。
#
# ⚠️ **刻意不升级**。lint 的 NewerVersionAvailable 会建议升到 2.4.1 —— 不要采纳：
# 这个版本号是与 RN 侧的**耦合约束**，不是"越新越好"的普通依赖。
# 升了它壳就可能读不了 RN 写的 MMKV 文件，而且**不报错**，只表现为用户升级后掉登录。
# 只有当 tipsy-app 的 react-native-mmkv 也升级时，才同步改这里。
#noinspection NewerVersionAvailable
mmkv = "2.2.4"

# 图片加载（W2 Home 卡片封面）。与 react-native-mmkv 同性质的**耦合约束**：
# react-native-screens 已引入 coil3 **3.0.4**（已核实其 android/build.gradle:249）。
# 声明更高版本会经 Gradle 冲突解析把 RN 那份也顶上去 —— 抬升 RN 生态运行时
# 依赖不属本波次范围。只有 tipsy-app 侧升级 react-native-screens 时才同步改。
#noinspection NewerVersionAvailable
coil = "3.0.4"

# 视频播放（W4 Screen P2 的 showcase 形态）。与 mmkv / coil 同性质的**耦合约束**：
# react-native-video 已把整套 media3 **1.8.0** 引进依赖树（已核实其
# android/gradle.properties:7 `RNVideo_media3Version=1.8.0`，且实测
# `:app:dependencies` 里 media3-exoplayer:1.8.0 经它传递而来）。
# 所以壳侧**不是新增依赖**，只是让直接使用的模块与既有运行时版本显式对齐。
#
# ⚠️ 声明更高版本会经 Gradle 冲突解析把 react-native-video 用的那份也顶上去
# —— RN 侧的视频播放（ChatDetail 的开场白视频等）就跑在被顶上去的 media3 上，
# 而它的失败模式是「某些设备上某些视频不播」，不是构建报错。
# 只有 tipsy-app 侧升级 react-native-video 时才同步改这里。
#noinspection NewerVersionAvailable
media3 = "1.8.0"

# ── AndroidX / Compose ──
# Compose BOM 须与 Kotlin 2.1.20 的 compose compiler 插件兼容。
composeBom = "2025.04.01"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
appcompat = "1.7.0"
fragment = "1.8.5"

# ── 测试 ──
junit = "4.13.2"
androidxJunit = "1.2.1"
# ⚠️ **3.7.0 是必需的，不是"顺手升级"**：3.6.1 的 Espresso 对
# `InputManager.getInstance` 的**反射查找在 API 36/37 上失败**
# （⚠️ 不是 AOSP 删了方法，是应用侧反射不可用）—— 表现是
# `NoSuchMethodException`，**基于 `createComposeRule` 的测试**起不来
# （实测 Pixel_10/android-37.1）。
# ⚠️ 范围仅限这类测试：`MmkvInteropTest` 不碰 Compose，同设备上一直是过的。
# 官方 3.7.0 release notes 有逐字对应的修复：
# "Use getSystemService instead of reflective InputManager.getInstance"。
#
# ⚠️ 它**只在 `androidTestImplementation`**（已核实 app/build.gradle:314），
# 不进 app/RN runtime，所以与 mmkv/coroutines/media3 那类**耦合约束不同性质** ——
# 那几条是「升了会顶掉 RN 的运行时版本」，这条纯粹是测试基础设施。
espressoCore = "3.7.0"
# ⚠️ **与 RN 侧的耦合约束，不是「越新越好」的普通依赖**（同 mmkv 的性质）。
# `expo-modules-core/android/build.gradle:191-192` 用 `api` 暴露 coroutines **1.7.3**，
# 它是壳运行时实际加载的版本。这里声明更高版本会通过 Gradle 的版本冲突解析
# 把整个 runtime 顶上去 —— 抬升 RN 生态的运行时依赖不属 W1 范围。
# 只有 tipsy-app 侧升级 expo-modules-core 时才同步改这里。
#noinspection NewerVersionAvailable
coroutines = "1.7.3"

[libraries]
mmkv = { module = "io.github.zhongwuzw:mmkv", version.ref = "mmkv" }
# 图片加载。**不是新增依赖**：react-native-screens 已经引入 coil3 3.0.4
# （已核实 node_modules/react-native-screens/android/build.gradle:249-253）。
# 壳显式声明同一版本，与 mmkv / coroutines 同性质 —— 版本是与 RN 侧的
# **耦合约束**：声明更高版本会经 Gradle 冲突解析把 RN 用的那份也顶上去。
# 只有 tipsy-app 侧升级 react-native-screens 时才同步改这里。
#noinspection NewerVersionAvailable
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
# coil3 的网络层要显式选：不引它则任何 http(s) URL 都静默不加载
# （只报一句 "no fetcher"，图片位置空白）。用 okhttp 那份 —— 壳与 RN
# 共享同一个 OkHttpClient 的理由见 ApiClient 注释。
#noinspection NewerVersionAvailable
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
# 动图解码（GIF / 动画 WebP）。**Map 卡片的动态封面依赖它** ——
# decoder 由 coil3 经 `META-INF/services/coil3.util.DecoderServiceLoaderTarget`
# **自动注册**，不需要手写 `.components { add(GifDecoder.Factory()) }`
# （已核实 aar 内含该 service 条目）。R8 侧无需额外 keep ——
# `ServiceLoaderComponentRegistry` 的 `ServiceLoader.load(...).iterator().asSequence()`
# 写法是 Coil 刻意为之，源码注释原文「written intentionally so R8 can optimize it」。
# ⚠️ 缺它时 Coil 只渲染**第一帧且不报错**，表现是"动图变静图"，没人会报。
# ⚠️ 与 svg 不同，这个是**真新增**：react-native-screens 只引了 coil / network-okhttp
# / svg 三个（已核实 android/build.gradle:249-253），**没有 gif**。
#noinspection NewerVersionAvailable
coil-gif = { module = "io.coil-kt.coil3:coil-gif", version.ref = "coil" }
# SVG 解码。**这是 Profile P7（头像框）的跨轨前置，本刀不消费它**。
# ⚠️ 它其实**已在依赖树里** —— react-native-screens 显式引了
# `coil-svg:3.0.4`（android/build.gradle:253）。这里显式声明只是把
# 隐式传递变成可见依赖，避免 RN 侧将来去掉它时壳静默失去 SVG 能力。
#noinspection NewerVersionAvailable
coil-svg = { module = "io.coil-kt.coil3:coil-svg", version.ref = "coil" }
# Media3 ExoPlayer（Screen P2 的 showcase mp4 播放）。**不是新增依赖** ——
# react-native-video 已引入整套 media3 1.8.0，见上方 [versions] 的说明。
# 只声明 exoplayer + ui：
#   - exoplayer  → ExoPlayer 本体（progressive mp4 够用，dash/hls/rtsp 均不需要）
#   - ui         → PlayerView / AspectRatioFrameLayout（RESIZE_MODE_ZOOM = RN 的 cover）
# media3-session 已由 react-native-video **传递引入**，并非不在依赖树中；
# 壳不直接声明它，也不实例化 MediaSession / MediaSessionService。依赖在 classpath
# 本身不会注册系统媒体通知或锁屏控制，Screen 因而仍只使用 ExoPlayer 播放层。
#noinspection NewerVersionAvailable
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
#noinspection NewerVersionAvailable
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
# 磁盘缓存（Screen P2 的 50MB，对齐 RN `bufferConfig.cacheSizeMB`）。
# 同样不是新增依赖：media3 1.8.0 整套已由 react-native-video 引入。
# `database` 提供 SimpleCache 需要的 StandaloneDatabaseProvider（RN 侧也用它）。
#noinspection NewerVersionAvailable
media3-datasource = { module = "androidx.media3:media3-datasource", version.ref = "media3" }
#noinspection NewerVersionAvailable
media3-database = { module = "androidx.media3:media3-database", version.ref = "media3" }
# JVM 单测用的**真实** org.json 实现。android.jar 里的是抛异常的 stub。
# ⚠️ 不用 testOptions.unitTests.returnDefaultValues = true 来绕 —— 那会让
# 所有未 mock 的 Android API 静默返回默认值，是方案 §5.4 点名的「假绿色」。
json = { module = "org.json:json", version = "20260719" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
# ⚠️ **不声明 okhttp 本体**：RN 自己就带（实测依赖树解析到 4.12.0），
# 壳与 RN 必须共享同一个 OkHttpClient —— 各起一套会让连接池/DNS/TLS session
# 变成两份，且「同一后端两条链路」的问题难查。
# mockwebserver 是测试专用，版本跟 RN 解析出的 okhttp 对齐，避免协议行为差异。
#noinspection NewerVersionAvailable
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version = "4.12.0" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# ProcessLifecycleOwner（ScreenFragment 用于 App 级前后台判定）。
# 曾经是 expo-dev-launcher 的传递依赖，壳排除 dev-client 系后必须自己声明。
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
