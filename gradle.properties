# 工程级 Gradle 配置。
# 下方 RN/Expo 段的取值对齐 CNG 参考工程（`npx expo prebuild` 产物）的
# tipsy-app/android/gradle.properties —— 那些值是 RN 0.81.4 + Expo 54 的
# 运行前提，不是可选优化，改动前先核对参考工程。

# R8 在 release 处理 50+ 个 RN/Expo 模块时 2G 堆会 OOM（W0 实测：
# minifyDirectApkReleaseWithR8 报 "Compilation failed to complete" +
# "Daemon will expire after running out of JVM heap space"）。
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# 配置缓存：RN/Expo 的 autolinking 大量使用 providers.exec，暂不开启，
# 待 W0 收尾时单独验证兼容性（方案 ADR-004 提到过该风险）。
org.gradle.configuration-cache=false

kotlin.code.style=official

android.useAndroidX=true
android.enablePngCrunchInReleaseBuilds=true

# ── RN / Expo 运行前提（对齐 CNG 参考工程）──
# 与 app.config.js 的 buildArchs 一致（release 只出两个 ABI）
reactNativeArchitectures=armeabi-v7a,arm64-v8a
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true
expo.edgeToEdgeEnabled=true
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false
expo.useLegacyPackaging=false
android.enableMinifyInReleaseBuilds=true
android.enableShrinkResourcesInReleaseBuilds=true
