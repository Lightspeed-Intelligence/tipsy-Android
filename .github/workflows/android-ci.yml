# Android 壳的 G1 fast gate（方案 §5.4）。
#
# 与 tipsy-app / tipsy-iOS 的 ci.yml 分开：那些是 agentic workflow（issue/PR 智能体），
# 本文件是纯构建门禁，职责不同、失败含义也不同。
#
# 范围取舍：assemble 只跑 googlePlayDebug 一个 flavor。三 flavor 全量 + release
# 留给 G3 nightly —— PR 门要快。但**这意味着 flavor 专属与 release 专属问题不由 G1 拦**
# （W0 抓到的 release 暴露 PreviewActivity 就属后者），nightly 必须补上。
name: Android CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'
      - '.gitmodules'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # 同一 PR 的新 push 取消旧运行，省额度
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  g1-fast-gate:
    name: G1 Fast Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout（含私有子模块 tipsy-app）
        uses: actions/checkout@v4
        with:
          # .gitmodules 用的是 SSH URL，而 CI 只有 HTTPS token ——
          # 故这里不让 checkout 自己拉子模块，下一步手工换成带 token 的 HTTPS。
          submodules: false
          persist-credentials: false

      # 凭据说明：PAT_TOKEN 是**本仓自己的** repo secret。
      # secret 按仓库隔离，没有跨仓引用语法 —— tipsy-iOS 上的同名 secret 在这里不可见，
      # 而 org 级只挂了 ANTHROPIC_* / FEISHU_LLMDOC_*，不含 PAT_TOKEN。
      # 现状是「同一 PAT 值在 tipsy-iOS 与本仓各存一份」：**轮换时必须两处都改**，
      # 漏改一处会让对应仓的 CI 在子模块那步失败。若以后 Android 侧要加更多 workflow，
      # 值得改成 org secret + 授权给本仓，只留一处真值。
      # auth 形式用 x-access-token（已实测对私有仓有效）。
      - name: 拉取 tipsy-app 子模块
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PAT_TOKEN:-}" ]; then
            echo "::error::缺少 PAT_TOKEN secret —— 无法 checkout 私有子模块 tipsy-app。"
            echo "::error::secret 是**按仓库**隔离的：tipsy-iOS 上的同名 secret 本仓看不到，"
            echo "::error::GITHUB_TOKEN 也只对本仓有权限、读不了 tipsy-app。"
            echo "::error::请在本仓 Settings → Secrets → Actions 添加 PAT_TOKEN（值可与 tipsy-iOS 相同）。"
            exit 1
          fi
          # 只改本地 URL，不写进 .gitmodules
          git config submodule.tipsy-app.url \
            "https://x-access-token:${PAT_TOKEN}@github.com/Lightspeed-Intelligence/tipsy-app.git"
          git submodule sync tipsy-app
          git submodule update --init --depth 1 tipsy-app
          echo "tipsy-app SHA: $(git -C tipsy-app rev-parse HEAD)"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tipsy-app/package-lock.json

      - name: 安装 RN 依赖
        working-directory: tipsy-app
        # 必须 npm ci（锁版本）；postinstall 会跑 patch-package，见方案 §3.2
        run: npm ci

      - name: 建仓库根 node_modules 软链
        # ADR-004：ExpoGradleHelperExtension 硬编码从 Gradle root 解析 RN，无覆盖入口。
        # 这个软链不入库，每个环境都要重建 —— CI 漏掉会以 autolinking 失败告终。
        run: |
          set -euo pipefail
          ln -sfn tipsy-app/node_modules node_modules
          test -e node_modules/expo/package.json || {
            echo "::error::软链无效，node_modules/expo/package.json 不存在"; exit 1; }

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 NDK 与 CMake
        # RN 新架构下 app 与多个模块都要跑 CMake（实测 :app、:expo-modules-core、
        # :react-native-gesture-handler 等），NDK 不是可选项。
        # 版本取自 gradle/libs.versions.toml，与本机保持一致。
        run: |
          set -euo pipefail
          NDK=$(grep -oE 'ndk = "[^"]+"' gradle/libs.versions.toml | cut -d'"' -f2)
          CMAKE=$(grep -oE 'cmake = "[^"]+"' gradle/libs.versions.toml | cut -d'"' -f2)
          # 空值检查：grep 未匹配时 cut 会输出空串而不报错，静默装错版本比失败更糟
          if [ -z "$NDK" ] || [ -z "$CMAKE" ]; then
            echo "::error::无法从 gradle/libs.versions.toml 解析 NDK/CMake 版本（NDK='$NDK' CMake='$CMAKE'）"
            exit 1
          fi
          echo "NDK=$NDK CMake=$CMAKE"
          sdkmanager --install "ndk;$NDK" "cmake;$CMAKE" > /dev/null

      - name: Setup Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Android lint（硬门）
        # abortOnError + warningsAsErrors 在 app/build.gradle 里配置；
        # lint-baseline.xml 只豁免既有问题，新增告警会失败。
        run: ./gradlew :app:lintDirectApkDebug --no-daemon --stacktrace

      - name: 上传 lint SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            app/build/reports/lint-results-*.sarif
            app/build/reports/lint-results-*.html
          if-no-files-found: warn

      - name: Assemble googlePlayDebug
        # 必须在单测之前 —— MergedManifestTest 断言的是 merged manifest 产物，
        # 没有产物它会 assumeTrue 跳过（**跳过在 JUnit 里算通过**，等于断言静默失效）。
        run: ./gradlew :app:assembleGooglePlayDebug --no-daemon --stacktrace

      - name: 生成 release merged manifest
        # MergedManifestTest 里有 3 条断言只对 release 有意义（开发期组件、
        # 敏感权限、largeHeap）。这里只跑 manifest 处理任务，**不跑 R8/打包** ——
        # 拿到断言所需产物即可，避免把 PR 门拉长到 release 全量构建的量级。
        run: ./gradlew :app:processGooglePlayReleaseMainManifest --no-daemon --stacktrace

      - name: 单元测试 + merged manifest 快照
        run: ./gradlew :app:testGooglePlayDebugUnitTest --no-daemon --stacktrace

      - name: 校验 manifest 断言真的跑了
        # 防「假绿」：assumeTrue 会让跳过的测试也算通过。这里断言测试确实执行过。
        run: |
          set -euo pipefail
          XML=$(find app/build/test-results -name 'TEST-*MergedManifestTest.xml' | head -1)
          if [ -z "$XML" ]; then
            echo "::error::没有 MergedManifestTest 结果文件 —— 测试没跑"; exit 1
          fi
          SKIPPED=$(grep -oE 'skipped="[0-9]+"' "$XML" | head -1 | grep -oE '[0-9]+')
          TESTS=$(grep -oE 'tests="[0-9]+"' "$XML" | head -1 | grep -oE '[0-9]+')
          echo "MergedManifestTest: $TESTS 条，跳过 $SKIPPED 条"
          if [ "${SKIPPED:-0}" != "0" ]; then
            echo "::error::有 $SKIPPED 条 manifest 断言被跳过（merged manifest 产物缺失？）"
            echo "::error::跳过不等于通过 —— 见方案 §5.4「NOT RUN 不等于通过」"
            exit 1
          fi

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
          if-no-files-found: warn
