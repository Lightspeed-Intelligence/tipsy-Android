# Android 壳的 G1 fast gate（方案 §5.4）。
#
# ✅ **已激活**（2026-08-10）：PAT_TOKEN 已配，pull_request / push 自动触发。
#
#    PAT_TOKEN 是本仓**独立签发**的 classic token，只勾 repo scope（够拉私有子模块）。
#    ⚠️ 它与 tipsy-iOS 的同名 secret **不是同一个值** —— 轮换本仓这个不影响 iOS，
#    反之亦然。（早期文档记的「同一值两处各存一份、轮换须两仓都改」已不适用。）
#
#    换机器 / 重建 secret 时：值经**交互输入或 stdin** 传给 `gh secret set PAT_TOKEN`，
#    第一个参数是**名字**。把值写成第一个参数会创建一个以 token 明文为名的 secret ——
#    **secret 名是可读的**，等于当场泄漏（2026-08-10 真踩过，已吊销重签）。
#
# 与 tipsy-app / tipsy-iOS 的 ci.yml 分开：那些是 agentic workflow（issue/PR 智能体），
# 本文件是纯构建门禁，职责不同、失败含义也不同。
#
# 范围取舍：assemble 只跑 googlePlayDebug 一个 flavor。三 flavor 全量 + release
# 留给 G3 nightly —— PR 门要快。但**这意味着 flavor 专属与 release 专属问题不由 G1 拦**
# （W0 抓到的 release 暴露 PreviewActivity 就属后者），nightly 必须补上。
name: Android CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'scripts/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'
      - '.gitmodules'
      # 桥模块住在 submodule 里，改它不会动本仓任何 path ——
      # 但 pin 前进一定伴随这个文件变化，所以它是子模块改动的可靠触发点。
      - 'tipsy-app'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # 同一 PR 的新 push 取消旧运行，省额度
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  g1-fast-gate:
    name: G1 Fast Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout（含私有子模块 tipsy-app）
        uses: actions/checkout@v4
        with:
          # .gitmodules 用的是 SSH URL，而 CI 只有 HTTPS token ——
          # 故这里不让 checkout 自己拉子模块，下一步手工换成带 token 的 HTTPS。
          submodules: false
          persist-credentials: false

      # 凭据说明：与 tipsy-iOS 同构 —— 它的 ci.yml / eas-build.yml 都用 repo 级
      # PAT_TOKEN 改写 submodule URL 走 HTTPS（runner 无 SSH key）。
      #
      # PAT_TOKEN 必须是**本仓自己的** repo secret：secret 按仓库隔离、没有跨仓引用语法，
      # tipsy-iOS 的同名 secret 在这里不可见；org 级只挂了 ANTHROPIC_* / FEISHU_LLMDOC_*
      # （org secret 需 admin:org，当前账号没有该 scope，故走 repo secret）。
      # 本仓的值是**独立签发**的，与 iOS 那个无关 —— 轮换互不影响。
      #
      # 注：tipsy-app 上那个只读 deploy key（eas-submodule-ro）状态是 **Never used**，
      # 是给 EAS 建的残留、不是在用的链路 —— 别误以为 SSH 那条路已经验证过。
      #
      # 与 iOS 的一处差异：iOS 用 git config --global ... insteadOf 全局改写所有
      # git@github.com: 前缀；这里只改 submodule.tipsy-app.url 一项，范围更窄，
      # 不影响其他 SSH 操作。行为等价。
      - name: 拉取 tipsy-app 子模块
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PAT_TOKEN:-}" ]; then
            echo "::error::缺少 PAT_TOKEN secret —— 无法 checkout 私有子模块 tipsy-app。"
            echo "::error::secret 是**按仓库**隔离的：tipsy-iOS 上的同名 secret 本仓看不到，"
            echo "::error::GITHUB_TOKEN 也只对本仓有权限、读不了 tipsy-app。"
            echo "::error::请在本仓 Settings → Secrets → Actions 添加 PAT_TOKEN（值可与 tipsy-iOS 相同）。"
            exit 1
          fi
          # ⚠️ **顺序不能颠倒**：`git submodule sync` 会把 local config 的 url
          # **覆盖回 .gitmodules 里的值**（那是 SSH URL）。W0 原先写成
          # 「先 config 再 sync」，等于自己撤销了刚设的 HTTPS URL —— 于是仍走 SSH，
          # runner 无 SSH key，报 `git@github.com: Permission denied (publickey)`。
          # 这个错看着像"凭据没配"，实际凭据是好的、只是没被用上（2026-08-10 实测）。
          git submodule sync tipsy-app
          # 只改 local config，不写进 .gitmodules（避免把 token 写进版本库）
          git config submodule.tipsy-app.url \
            "https://x-access-token:${PAT_TOKEN}@github.com/Lightspeed-Intelligence/tipsy-app.git"
          # 不用 --depth 1：子模块 pin 常滞后于 tipsy-app 的 main tip，
          # 浅拉不保证能取到 pin 的那个 commit（这条经验来自 tipsy-iOS 的 eas-build.yml）。
          git submodule update --init tipsy-app
          # 断言真的取到了 pin 的那个 commit，且工作树非空 ——
          # update 在某些失败模式下会"成功"但留下空目录
          EXPECTED=$(git rev-parse HEAD:tipsy-app)
          ACTUAL=$(git -C tipsy-app rev-parse HEAD)
          echo "tipsy-app pin=$EXPECTED actual=$ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::子模块 SHA 与 pin 不一致（pin=$EXPECTED actual=$ACTUAL）"
            exit 1
          fi
          test -f tipsy-app/package.json || {
            echo "::error::子模块工作树为空（package.json 不存在）"; exit 1; }

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tipsy-app/package-lock.json

      - name: 配置私有 git 依赖凭据（@tipsy/tracker）
        # RN 合入 release/1.4.6 后 package-lock 里有 git+ssh:// 的私有依赖
        # （github.com/Lightspeed-Intelligence/tipsy-tracking）。runner 无 SSH key，
        # 不重写 URL 时 npm ci 在 clone 该依赖处必挂。全局 insteadOf 把两种 ssh
        # 形式都重写为带 token 的 HTTPS（iOS CI 同解）；子模块那步的显式 https
        # URL 不受影响。PAT_TOKEN 复用拉子模块的同一个 —— classic token 的 repo
        # scope 覆盖签发账号可读的全部私有仓，但**签发账号必须对 tipsy-tracking
        # 有读权限**，缺权限的症状是 npm ci 报 128 而非 401。
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${PAT_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${PAT_TOKEN}@github.com/".insteadOf "git@github.com:"

      - name: 安装 RN 依赖
        working-directory: tipsy-app
        # 必须 npm ci（锁版本）；postinstall 会跑 patch-package，见方案 §3.2
        run: npm ci

      - name: 建仓库根 node_modules 软链
        # ADR-004：兼容仍以非标准 Gradle root 为 JS package 解析起点的模块。
        # Node executable 由绝对路径契约处理；目录软链仍须在每个环境重建。
        run: |
          set -euo pipefail
          ln -sfn tipsy-app/node_modules node_modules
          test -e node_modules/expo/package.json || {
            echo "::error::软链无效，node_modules/expo/package.json 不存在"; exit 1; }

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 NDK 与 CMake
        # RN 新架构下 app 与多个模块都要跑 CMake（实测 :app、:expo-modules-core、
        # :react-native-gesture-handler 等），NDK 不是可选项。
        # 版本取自 gradle/libs.versions.toml，与本机保持一致。
        run: |
          set -euo pipefail
          NDK=$(grep -oE 'ndk = "[^"]+"' gradle/libs.versions.toml | cut -d'"' -f2)
          CMAKE=$(grep -oE 'cmake = "[^"]+"' gradle/libs.versions.toml | cut -d'"' -f2)
          # 空值检查：grep 未匹配时 cut 会输出空串而不报错，静默装错版本比失败更糟
          if [ -z "$NDK" ] || [ -z "$CMAKE" ]; then
            echo "::error::无法从 gradle/libs.versions.toml 解析 NDK/CMake 版本（NDK='$NDK' CMake='$CMAKE'）"
            exit 1
          fi
          echo "NDK=$NDK CMake=$CMAKE"
          sdkmanager --install "ndk;$NDK" "cmake;$CMAKE" > /dev/null

      - name: Setup Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Node 绝对路径契约（PATH 不含 node）
        # 覆盖 settings、Expo autolinking/constants、RN codegen 与
        # Reanimated/Worklets validator。
        # 脚本会刻意从 PATH 移除 setup-node，防止依赖升级重新引入裸 `node`。
        run: |
          export TIPSY_NODE_EXECUTABLE="$(node --print process.execPath)"
          ./scripts/check-node-contract.sh

      - name: Android lint（硬门）
        # abortOnError + warningsAsErrors 在 app/build.gradle 里配置；
        # lint-baseline.xml 只豁免既有问题，新增告警会失败。
        run: ./gradlew :app:lintDirectApkDebug --no-daemon --stacktrace

      - name: 上传 lint SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            app/build/reports/lint-results-*.sarif
            app/build/reports/lint-results-*.html
          if-no-files-found: warn

      - name: Assemble googlePlayDebug
        # 必须在单测之前 —— MergedManifestTest 断言的是 merged manifest 产物，
        # 没有产物它会 assumeTrue 跳过（**跳过在 JUnit 里算通过**，等于断言静默失效）。
        run: ./gradlew :app:assembleGooglePlayDebug --no-daemon --stacktrace

      - name: 生成 release merged manifest
        # MergedManifestTest 里有 3 条断言只对 release 有意义（开发期组件、
        # 敏感权限、largeHeap）。这里只跑 manifest 处理任务，**不跑 R8/打包** ——
        # 拿到断言所需产物即可，避免把 PR 门拉长到 release 全量构建的量级。
        run: ./gradlew :app:processGooglePlayReleaseMainManifest --no-daemon --stacktrace

      - name: 单元测试 + merged manifest 快照
        run: ./gradlew :app:testGooglePlayDebugUnitTest --no-daemon --stacktrace

      - name: tipsy-auth 桥单测
        # 桥模块住在 submodule 里（tipsy-app/modules/tipsy-auth），但它是**壳的一部分**
        # —— 契约、registry、主线程切换都由本仓的壳消费，坏了壳直接不可用。
        #
        # 为什么必须进 G1：LiveAppSafetyTest 守的是本项目最高危的失败模式 ——
        # 该模块会被 autolink 进**现网三个 RN 包**，那里没有壳、不注册 provider，
        # 此时 isShellHost() 必须为 false。若为 true，现网 App 会把 auth 交给
        # 一个不存在的壳 → **直接掉登录**。这条断言不进 CI 等于没有防线。
        run: ./gradlew :tipsy-auth:testDebugUnitTest --no-daemon --stacktrace

      - name: 校验关键断言真的跑了（skipped=0）
        # 防「假绿」：assumeTrue 会让跳过的测试也算通过（JUnit 语义）。
        # 这里对两个**守边界**的 suite 断言它们确实执行过且零跳过：
        #   MergedManifestTest —— 三渠道 applicationId / release 不含开发期组件
        #   LiveAppSafetyTest  —— 无 provider 时 isShellHost() 必须 false（现网掉登录防线）
        run: |
          set -euo pipefail
          check() {
            local name="$1" root="$2"
            local xml
            xml=$(find "$root" -name "TEST-*${name}.xml" 2>/dev/null | head -1)
            if [ -z "$xml" ]; then
              echo "::error::没有 ${name} 结果文件 —— 测试没跑"
              return 1
            fi
            local tests skipped
            tests=$(grep -oE 'tests="[0-9]+"' "$xml" | head -1 | grep -oE '[0-9]+')
            skipped=$(grep -oE 'skipped="[0-9]+"' "$xml" | head -1 | grep -oE '[0-9]+')
            echo "${name}: ${tests} 条，跳过 ${skipped:-0} 条"
            if [ "${tests:-0}" = "0" ]; then
              echo "::error::${name} 一条都没跑"
              return 1
            fi
            if [ "${skipped:-0}" != "0" ]; then
              echo "::error::${name} 有 ${skipped} 条被跳过 —— 跳过不等于通过"
              echo "::error::见方案 §5.4「NOT RUN 不等于通过」"
              return 1
            fi
          }
          rc=0
          check MergedManifestTest app/build/test-results || rc=1
          check LiveAppSafetyTest tipsy-app/modules/tipsy-auth/android/build/test-results || rc=1
          exit $rc

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
          if-no-files-found: warn
