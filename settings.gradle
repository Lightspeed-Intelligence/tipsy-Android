// Tipsy Android 原生壳 —— settings（Groovy DSL，方案 ADR-004：全仓不混 .gradle.kts）
//
// 布局差异：Gradle root = 仓库根，RN 业务在 ./tipsy-app（git submodule）。
// 标准 Expo 布局是 Gradle root = <rn-project>/android，因此需要两处显式处理：
//   1. expoAutolinking.projectRoot 指向 tipsy-app（官方公开可覆盖项）
//   2. 仓库根的 node_modules 软链（见 .gitignore 说明）——
//      ExpoGradleHelperExtension.getReactNativeDir 硬编码从 Gradle root 跑
//      `node --print require.resolve('react-native/package.json')` 且无覆盖入口
//
// 本文件的 includeBuild / plugins / autolinking 写法对齐 CNG 生成的参考工程
// （`npx expo prebuild --platform android` 的产物），只改布局相关的路径。
//
// Node 显式解析（方案 ADR-004 第 3 条）：Node 是本仓库真实的构建输入，而
// fnm/nvm/asdf 只在交互式 shell 注入 PATH —— 从 Finder/Dock 启动的
// Android Studio、launchd、多数 CI runner 都解析不到裸 "node"，报
// "A problem occurred starting process 'command 'node''" 且无上下文。
//
// pluginManagement 必须是 settings 脚本第一条语句，故这段逻辑只能内联，
// 结果经 gradle.ext 暴露给后续构建复用。

pluginManagement {
    def settingsRoot = settingsDir
    def rnProjectRoot = new File(settingsRoot, 'tipsy-app')

    def trimToNull = { String value ->
        def trimmed = value?.trim()
        return (trimmed == null || trimmed.isEmpty()) ? null : trimmed
    }

    def readLocalProperty = { String key ->
        def file = new File(settingsRoot, 'local.properties')
        if (!file.exists()) return null
        def props = new Properties()
        file.withInputStream { props.load(it) }
        return trimToNull(props.getProperty(key))
    }

    // 优先级：环境变量（CI）→ local.properties（开发机，不入库）
    //        → Gradle property（可选团队默认）→ 回退裸 "node" 走 $PATH
    def candidates = [
        [source: 'TIPSY_NODE_EXECUTABLE 环境变量',
         value : trimToNull(providers.environmentVariable('TIPSY_NODE_EXECUTABLE').getOrElse(''))],
        [source: 'local.properties 的 tipsy.node.executable',
         value : readLocalProperty('tipsy.node.executable')],
        [source: 'tipsy.node.executable Gradle property',
         value : trimToNull(providers.gradleProperty('tipsy.node.executable').getOrElse(''))],
    ].findAll { it.value != null }

    def nodeExecutable = 'node'
    def nodeSource = '$PATH 查找'
    if (!candidates.isEmpty()) {
        def selected = candidates.first()
        def file = new File(selected.value)
        if (!file.isAbsolute()) {
            throw new GradleException("${selected.source} 必须是绝对路径，当前为 '${selected.value}'。")
        }
        if (!file.isFile() || !file.canExecute()) {
            throw new GradleException("${selected.source} 指向 '${selected.value}'，它不是可执行文件。")
        }
        nodeExecutable = file.absolutePath
        nodeSource = selected.source
    }

    // ── 裸 "node" 调用点的前置检查（不是兜底，是提前失败）────────────────
    //
    // 上面解析出的绝对路径只对**显式传参**的调用点有效（commandLine(nodeExecutable, …)）。
    // 但 Expo 的 AutolinkingCommandBuilder 硬编码裸 "node" 且无覆盖入口，
    // 又位于禁止修改的 tipsy-app/node_modules —— 那些调用点**只能靠进程自身的 PATH**。
    //
    // ⚠️ 这里曾经放过一段「把 node 目录前置进 daemon PATH」的 hack
    //    （ProcessEnvironment.maybeSetEnvironmentVariable）。**实测无效已删**：
    //    子进程确实继承了新 PATH（sh -c 'command -v node' 能找到），
    //    但 Gradle 解析 program name 时不看它，同一次构建内
    //    providers.exec { commandLine('node', …) } 仍抛 error=2。
    //    且那段包在 catch (Throwable ignored) 里静默失败，会让人误以为有兜底。
    //
    // 真正的解法是让**进程本身**的 PATH 含 node 目录：
    //   - 终端跑 ./gradlew：shell PATH 已含（fnm/nvm 会注入），天然可用
    //   - Android Studio：**用 `/Applications/Android Studio (Tipsy).app` 启动**。
    //     那是个 `#!/bin/zsh -l` 的包装 app：登录 shell 重建 PATH 后再 exec 真正的
    //     Studio，因此 native environ 一定含 node。日志见
    //     $TMPDIR/tipsy-studio-launcher.log。等价手段是从终端直接跑
    //     `/Applications/Android\ Studio.app/Contents/MacOS/studio &`。
    //
    // ⚠️ **`launchctl setenv` / LaunchAgent 治不了这个坑**（2026-08-14 定论，
    //    2026-08-10/11/13/14 四次复发换来的结论，别再往那个方向试）：
    //    exec 解析 program name 读的是**native process environ**，而 Studio 的
    //    "shell environment import" 只补 JVM 层的 env map。两者可以不一致 ——
    //    这正是报错里 $PATH 看着是好的、fork 却仍 error=2 的原因。
    //    且 runningboardd 按 bundle id **缓存** app 的 native 启动环境、缓存跨 ⌘Q 存活，
    //    launchctl setenv 只改「launchd 往后发什么」，**无法失效已缓存的那份**。
    //
    // 所以这里只做检查并**明确报错**，而不是假装能修好 —— 否则失败点会漂移到
    // 某个 plugin 内部，报出无上下文的 `Cannot run program "node"`。
    // ⚠️ 探针必须**真的 fork 一次裸 `node`**，不能只读 System.getenv('PATH')。
    //    2026-08-12 实测：旧的 System.getenv('PATH') 检查会**误放行**。
    //    Studio 用 Tooling API 在自己进程里跑 settings 脚本，而它启动时导入过一次
    //    shell 环境（idea.log: "shell environment loaded (/bin/zsh, 30 vars)"），
    //    于是 JVM 自身的 $PATH 含 node、fork 出去的子进程却只有裸
    //    /usr/bin:/bin:/usr/sbin:/sbin —— 检查通过，构建随后死在 Expo 内部，
    //    同一次构建的日志里既有 "[Tipsy] node vX" 又有 Cannot run program "node"。
    //    只有 fork 才测得到 Expo 真正走的那条路。
    def bareNodeError = null
    try {
        providers.exec {
            commandLine('node', '--version')
        }.standardOutput.asText.get()
    } catch (Exception e) {
        bareNodeError = e.message ?: e.toString()
    }
    if (bareNodeError != null) {
        throw new GradleException(
            "fork 子进程时找不到可执行的 `node` —— 这正是 Expo autolinking 的调用方式。\n" +
            "\n" +
            "已解析到 node 绝对路径（${nodeSource}）：${nodeExecutable}\n" +
            "但它**不够** —— Expo 的 autolinking plugin 硬编码裸 `node`，\n" +
            "只能靠进程自身的 \$PATH 解析，无法用参数覆盖。\n" +
            "\n" +
            "当前 JVM 的 \$PATH：${System.getenv('PATH') ?: '(空)'}\n" +
            "（它可能看着是好的而子进程仍失败：Studio 启动时导入过 shell 环境。）\n" +
            "原始错误：${bareNodeError}\n" +
            "\n" +
            "这说明 Studio 不是用包装 app 启动的（从 Dock 直接开原版 Studio 会命中\n" +
            "runningboardd 缓存的裸 environ）。**三步修好**（终端里执行）：\n" +
            "  1) ./gradlew --stop                        # 旧 daemon 带着坏 PATH，会被复用\n" +
            "  2) ⌘Q 完全退出 Android Studio\n" +
            "  3) 打开 `/Applications/Android Studio (Tipsy).app`（Dock 里换成这个图标）\n" +
            "     它是 `#!/bin/zsh -l` 包装：先用登录 shell 重建 PATH 再 exec 真 Studio。\n" +
            "     日志：\$TMPDIR/tipsy-studio-launcher.log\n" +
            "     等价手段：终端跑 `/Applications/Android\\ Studio.app/Contents/MacOS/studio &`\n" +
            "     若包装 app 不存在，见 llmdoc/reference/android-native-progress.md §2.3 重建。\n" +
            "\n" +
            "⚠️ **别再试 `launchctl setenv` / LaunchAgent** —— 已证实无效（详见上方注释）：\n" +
            "   exec 解析 program name 读 native environ，Studio 只补 JVM env map，\n" +
            "   且 runningboardd 的 bundle 级缓存跨 ⌘Q 存活、launchctl 无法使其失效。\n" +
            "\n" +
            "诊断要看**进程实际**的 PATH（不是 launchctl getenv，两者不一致正是本坑特征）：\n" +
            "  ps eww \$(pgrep -f 'MacOS/studio' | head -1) | tr ' ' '\\n' | grep ^PATH=\n" +
            "\n" +
            "从终端跑通常不会遇到（shell PATH 已含 node）。\n" +
            "详见 llmdoc/reference/android-native-progress.md 的 §2.3 与方案 ADR-004 第 3 条。"
        )
    }

    // 尽早验证，替代 Gradle 无上下文的报错
    try {
        def nodeVersion = providers.exec {
            commandLine(nodeExecutable, '--version')
        }.standardOutput.asText.get().trim()
        gradle.ext.tipsyNodeExecutable = nodeExecutable
        gradle.ext.tipsyRnProjectRoot = rnProjectRoot
        println "[Tipsy] node ${nodeVersion}（来源：${nodeSource}）"
    } catch (Exception e) {
        throw new GradleException(
            "无法执行 node（来源：${nodeSource}，路径：${nodeExecutable}）。\n" +
            "请设置 TIPSY_NODE_EXECUTABLE 环境变量，或在 local.properties 写入\n" +
            "  tipsy.node.executable=/absolute/path/to/node\n" +
            "原始错误：${e.message}"
        )
    }

    // RN Gradle plugin（included build，非 Maven 制品）——工作目录用 RN 工程根
    def reactNativeGradlePlugin = new File(
        providers.exec {
            workingDir(rnProjectRoot)
            commandLine(nodeExecutable, '--print',
                "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
        }.standardOutput.asText.get().trim()
    ).getParentFile().absolutePath
    includeBuild(reactNativeGradlePlugin)

    // Expo autolinking plugin（included build）
    def expoPluginsPath = new File(
        providers.exec {
            workingDir(rnProjectRoot)
            commandLine(nodeExecutable, '--print',
                "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
        }.standardOutput.asText.get().trim(),
        '../android/expo-gradle-plugin'
    ).absolutePath
    includeBuild(expoPluginsPath)

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'com.facebook.react.settings'
    id 'expo-autolinking-settings'
}

// ADR-004 支点 1：projectRoot 是官方公开可覆盖项，其 doc 注释明写
// "Should be used by projects that don't follow the /android folder structure"。
// 必须在 useExpoModules() / rnConfigCommand 之前设置。
expoAutolinking {
    projectRoot = gradle.ext.tipsyRnProjectRoot

    // W0 严格隔离（方案 §5.2）：只验证「壳能启动 + 能挂 DebugSurface」，
    // 不启用任何真实业务能力。这些模块各自要求 W0 尚不具备的前提：
    //   expo-updates      —— OTA 属 W4，且需先定 channel/runtime 隔离方案（§5.3）
    //   expo-splash-screen—— 需 app.config.js 生成的 splash 资源（壳不跑 prebuild）
    //   expo-dev-client 系 —— dev launcher/menu 会劫持 bundle 加载，壳自管入口
    // 每一项都必须由所属 packet 在 owner 契约与 manifest gate 就绪后单独接回，
    // **不要为了让构建变绿而随手删掉某一行**。
    exclude = [
        'expo-updates',
        'expo-splash-screen',
        'expo-dev-client',
        'expo-dev-launcher',
        'expo-dev-menu',
        'expo-dev-menu-interface',
    ]
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    // workingDirectory 必须显式传 RN 工程根。
    // 默认值是 settings.layout.rootDirectory.dir("../")，即「Gradle root 的父目录」
    // —— 这假设了标准布局（Gradle root = <rn-project>/android，父目录正好是 RN 工程根）。
    // 本仓 Gradle root = 仓库根，父目录是 ~/Developer，那里没有 node_modules，
    // 命令内的 require.resolve('expo/package.json') 直接抛
    // "Cannot find module 'expo/package.json'"，且 Gradle 只报
    // "Process 'command 'node'' finished with non-zero exit value 1"（stderr 被吞）。
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand, gradle.ext.tipsyRnProjectRoot)
}

expoAutolinking.useExpoModules()

rootProject.name = 'tipsy-Android'

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)
